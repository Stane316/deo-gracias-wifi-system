name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres   # PG jetable CI (aucun secret)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres   # credentielle jetable du container ephemere CI
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Migrations base (tests integration backend IMP-12)
        run: bash tools/db-migrate.sh up
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  db-migrations:
    # IMP-09 : migrations SQL testées sur Postgres éphémère (service container),
    # sans Docker ni CLI Supabase, sans aucun secret projet.
    name: Migrations Postgres (up/smoke/down/up)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres   # credentielle jetable du container éphémère CI
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations up
        run: bash tools/db-migrate.sh up
      - name: Smoke (contrat de schéma)
        run: bash tools/db-migrate.sh smoke
      - name: Down (réversibilité)
        run: bash tools/db-migrate.sh down
      - name: Up à nouveau (idempotence du cycle)
        run: |
          bash tools/db-migrate.sh up
          bash tools/db-migrate.sh smoke
      - name: Tests RLS (matrice anon/authenticated/service_role)
        run: bash tools/db-migrate.sh rls
      - name: Tests gardes d'etats (transitions + audit)
        run: bash tools/db-migrate.sh states

  secrets-scan:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
